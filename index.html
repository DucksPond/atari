<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atari Breakout Replica with Improved Paddle Collision</title>
<link rel="icon" href="path/to/your/favicon.ico" type="https://upload.wikimedia.org/wikipedia/commons/1/1d/Atari_Logo.png">
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: #000;
    font-family: Arial, sans-serif;
  }
  canvas {
    display: block;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // Responsive canvas sizing
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (gameState === "menu") drawMenu();
    else initGame();
  }
  window.addEventListener("resize", resizeCanvas);

  // Game variables
  const ballRadius = 10;
  let x, y, dx, dy;
  let paddleHeight, paddleWidth, paddleX;
  let brickRowCount = 5;
  let brickColumnCount;
  let brickWidth, brickHeight, brickPadding, brickOffsetTop, brickOffsetLeft;
  let bricks = [];
  let score = 0;
  let lives = 3;
  let rightPressed = false;
  let leftPressed = false;
  const maxSpeed = 8;
  const speedIncrement = 0.3;

  // Endless mode variables
  let endlessMode = false;
  const regenDelay = 3000; // 3 seconds
  let regenQueue = [];

  // Game state: "menu", "playing"
  let gameState = "menu";

  // Button areas for menu
  let buttons = [];

  // Initialize or reset game variables based on canvas size
  function initGame() {
    // Paddle size relative to canvas width
    paddleWidth = canvas.width * 0.15;
    paddleHeight = 12;
    paddleX = (canvas.width - paddleWidth) / 2;

    // Ball start position
    x = canvas.width / 2;
    y = canvas.height - paddleHeight - ballRadius - 10;

    // Initial ball velocity (randomize horizontal direction)
    const initialSpeed = 4;
    dx = (Math.random() > 0.5 ? 1 : -1) * initialSpeed;
    dy = -initialSpeed;

    // Brick layout calculations based on canvas width
    brickPadding = 10;
    brickHeight = 20;
    brickOffsetTop = 50;
    brickOffsetLeft = 30;

    brickColumnCount = Math.floor((canvas.width - brickOffsetLeft * 2 + brickPadding) / (75 + brickPadding));
    brickWidth = (canvas.width - brickOffsetLeft * 2 - brickPadding * (brickColumnCount - 1)) / brickColumnCount;

    score = 0;
    lives = 3;
    regenQueue = [];

    setupBricks();
  }

  // Create bricks array with random colors
  function setupBricks() {
    bricks = [];
    for(let c = 0; c < brickColumnCount; c++) {
      bricks[c] = [];
      for(let r = 0; r < brickRowCount; r++) {
        bricks[c][r] = {
          x: 0,
          y: 0,
          status: 1,
          color: randomColor(),
          animProgress: 1 // fully visible
        };
      }
    }
  }

  // Generate a random bright color for bricks
  function randomColor() {
    const hue = Math.floor(Math.random() * 360);
    return `hsl(${hue}, 70%, 60%)`;
  }

  // Draw functions
  function drawBall() {
    ctx.beginPath();
    ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.closePath();
  }

  function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);
    ctx.fillStyle = "#00ffff";
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.closePath();
  }

  function drawBricks(time) {
    for(let c = 0; c < brickColumnCount; c++) {
      for(let r = 0; r < brickRowCount; r++) {
        const b = bricks[c][r];
        if(b.status === 1 || (endlessMode && b.animProgress < 1)) {
          const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
          const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
          b.x = brickX;
          b.y = brickY;

          // Animate regeneration: scale and bounce effect
          let scale = 1;
          if (endlessMode && b.animProgress < 1) {
            const p = b.animProgress;
            scale = easeOutBack(p);
            if (p >= 1) b.animProgress = 1;
          }

          ctx.save();
          ctx.translate(brickX + brickWidth/2, brickY + brickHeight/2);
          ctx.scale(scale, scale);
          ctx.translate(-(brickX + brickWidth/2), -(brickY + brickHeight/2));

          ctx.beginPath();
          ctx.rect(brickX, brickY, brickWidth, brickHeight);
          ctx.fillStyle = b.color;
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.closePath();

          ctx.restore();
        }
      }
    }
  }

  // Easing function for bounce animation (overshoot)
  function easeOutBack(x) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  function drawScore() {
    ctx.font = "18px Arial";
    ctx.fillStyle = "#fff";
    ctx.fillText("Score: " + score, 20, 30);
  }

  function drawLives() {
    ctx.font = "18px Arial";
    ctx.fillStyle = "#fff";
    ctx.fillText("Lives: " + lives, canvas.width - 100, 30);
  }

  // Collision detection with bricks
  function collisionDetection(time) {
    for(let c = 0; c < brickColumnCount; c++) {
      for(let r = 0; r < brickRowCount; r++) {
        const b = bricks[c][r];
        if(b.status === 1) {
          if(
            x + ballRadius > b.x &&
            x - ballRadius < b.x + brickWidth &&
            y + ballRadius > b.y &&
            y - ballRadius < b.y + brickHeight
          ) {
            dy = -dy;
            if (endlessMode) {
              b.status = 0;
              b.animProgress = 0;
              regenQueue.push({c, r, startTime: time});
            } else {
              b.status = 0;
            }
            score++;

            const speed = Math.sqrt(dx * dx + dy * dy);
            if(speed < maxSpeed) {
              dx *= 1.05;
              dy *= 1.05;
            }

            if(!endlessMode && score === brickRowCount * brickColumnCount) {
              setTimeout(() => {
                alert("YOU WIN, CONGRATS!");
                gameState = "menu";
                drawMenu();
              }, 100);
            }
          }
        }
      }
    }
  }

  // Animate regenerating bricks in endless mode
  function updateRegenBricks(time, delta) {
    for(let i = regenQueue.length - 1; i >= 0; i--) {
      const item = regenQueue[i];
      const b = bricks[item.c][item.r];
      const elapsed = time - item.startTime;
      if (elapsed >= regenDelay) {
        if (!item.animStart) item.animStart = time;
        const animElapsed = time - item.animStart;
        b.animProgress = Math.min(animElapsed / 600, 1);
        if (b.animProgress >= 1) {
          b.status = 1;
          regenQueue.splice(i, 1);
        }
      }
    }
  }

  // Improved paddle collision: check full ball-paddle intersection
  function paddleCollision() {
    const paddleTop = canvas.height - paddleHeight - 10;
    const paddleBottom = paddleTop + paddleHeight;
    const paddleLeft = paddleX;
    const paddleRight = paddleX + paddleWidth;

    // Check if ball is intersecting paddle rectangle (considering ball radius)
    if (
      y + ballRadius >= paddleTop &&
      y - ballRadius <= paddleBottom &&
      x + ballRadius >= paddleLeft &&
      x - ballRadius <= paddleRight &&
      dy > 0 // only bounce if ball is moving downwards
    ) {
      // Calculate hit position relative to paddle center (-1 to 1)
      const relativeHitPos = ((x - paddleX) / paddleWidth) * 2 - 1;
      const maxBounceAngle = (75 * Math.PI) / 180;
      const bounceAngle = relativeHitPos * maxBounceAngle;
      const speed = Math.min(maxSpeed, Math.sqrt(dx * dx + dy * dy) + speedIncrement);

      dx = speed * Math.sin(bounceAngle);
      dy = -speed * Math.cos(bounceAngle);

      // Place ball just above paddle to prevent sticking
      y = paddleTop - ballRadius - 1;
    }
  }

  // Draw menu screen
  function drawMenu() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ffff";
    ctx.font = `bold ${Math.floor(canvas.height / 12)}px Arial`;
    ctx.textAlign = "center";
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 20;
    ctx.fillText("Atari Breakout Replica", canvas.width / 2, canvas.height / 3);
    ctx.shadowBlur = 0;

    const btnWidth = canvas.width / 4;
    const btnHeight = canvas.height / 12;
    const btnX = (canvas.width - btnWidth) / 2;
    const startY = canvas.height / 2;
    const gap = btnHeight + 20;

    buttons = [
      { text: "Start Game", x: btnX, y: startY, width: btnWidth, height: btnHeight },
      { text: "Start Endless", x: btnX, y: startY + gap, width: btnWidth, height: btnHeight }
    ];

    buttons.forEach(btn => {
      ctx.fillStyle = "#004040";
      ctx.shadowColor = "#00ffff";
      ctx.shadowBlur = 10;
      ctx.fillRect(btn.x, btn.y, btn.width, btn.height);
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#00ffff";
      ctx.font = `bold ${Math.floor(btnHeight / 2)}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(btn.text, btn.x + btn.width / 2, btn.y + btn.height / 2);
    });
  }

  // Handle menu clicks
  function onCanvasClick(e) {
    if (gameState !== "menu") return;

    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    for (const btn of buttons) {
      if (
        clickX >= btn.x &&
        clickX <= btn.x + btn.width &&
        clickY >= btn.y &&
        clickY <= btn.y + btn.height
      ) {
        if (btn.text === "Start Game") {
          endlessMode = false;
          gameState = "playing";
          initGame();
          draw();
        } else if (btn.text === "Start Endless") {
          endlessMode = true;
          gameState = "playing";
          initGame();
          draw();
        }
        break;
      }
    }
  }
  canvas.addEventListener("click", onCanvasClick);

  // Keyboard event handlers
  document.addEventListener("keydown", e => {
    if(gameState !== "playing") return;
    if(e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
    else if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
  });
  document.addEventListener("keyup", e => {
    if(gameState !== "playing") return;
    if(e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
    else if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
  });

  // Touch controls for mobile
  let touchX = null;
  canvas.addEventListener("touchstart", e => {
    if(gameState !== "playing") return;
    if(e.touches.length === 1) {
      touchX = e.touches[0].clientX;
    }
  });
  canvas.addEventListener("touchmove", e => {
    if(gameState !== "playing") return;
    if(e.touches.length === 1) {
      const newTouchX = e.touches[0].clientX;
      const deltaX = newTouchX - touchX;
      paddleX += deltaX;
      if(paddleX < 0) paddleX = 0;
      else if(paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
      touchX = newTouchX;
    }
  });
  canvas.addEventListener("touchend", e => {
    touchX = null;
  });

  // Main draw loop
  let lastTime = 0;
  function draw(time=0) {
    if(gameState === "menu") {
      drawMenu();
      return;
    }

    const delta = time - lastTime;
    lastTime = time;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBricks(time);
    drawBall();
    drawPaddle();
    drawScore();
    drawLives();

    collisionDetection(time);

    if (endlessMode) updateRegenBricks(time, delta);

    // Wall collisions
    if(x + dx > canvas.width - ballRadius) {
      x = canvas.width - ballRadius;
      dx = -dx;
    } else if(x + dx < ballRadius) {
      x = ballRadius;
      dx = -dx;
    }
    if(y + dy < ballRadius) {
      y = ballRadius;
      dy = -dy;
    }

    // Paddle collision (improved)
    paddleCollision();

    // Check if ball touches bottom edge (missed paddle)
    if (y + dy >= canvas.height - ballRadius) {
      lives--;
      if(lives === 0) {
        setTimeout(() => {
          alert("GAME OVER");
          gameState = "menu";
          drawMenu();
        }, 100);
      } else {
        x = canvas.width / 2;
        y = canvas.height - paddleHeight - ballRadius - 10;
        const initialSpeed = 4;
        dx = (Math.random() > 0.5 ? 1 : -1) * initialSpeed;
        dy = -initialSpeed;
        paddleX = (canvas.width - paddleWidth) / 2;
      }
    }

    if(rightPressed && paddleX < canvas.width - paddleWidth) {
      paddleX += 10;
    }
    if(leftPressed && paddleX > 0) {
      paddleX -= 10;
    }

    x += dx;
    y += dy;

    requestAnimationFrame(draw);
  }

  // Initial setup
  resizeCanvas();
  drawMenu();
})();
</script>
</body>
</html>
